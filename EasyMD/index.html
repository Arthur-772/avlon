<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyMD</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-group">
          <button id="btn-new" class="tb-btn" data-i18n-title="new">
            <span class="tb-icon" data-icon="file-plus"></span>
          </button>
          <button id="btn-open" class="tb-btn" data-i18n-title="open">
            <span class="tb-icon" data-icon="folder-open"></span>
          </button>
          <button id="btn-save" class="tb-btn" data-i18n-title="save">
            <span class="tb-icon" data-icon="save"></span>
          </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <button id="btn-source" class="tb-btn" data-i18n-title="sourceMode">
            <span class="tb-icon" data-icon="code"></span>
          </button>
          <button id="btn-outline" class="tb-btn" data-i18n-title="outline">
            <span class="tb-icon" data-icon="list"></span>
          </button>
          <button id="btn-settings" class="tb-btn" data-i18n-title="settings">
            <span class="tb-icon" data-icon="settings"></span>
          </button>
        </div>
      </header>
      <nav id="tab-bar" class="tab-bar"></nav>
      <div class="main">
        <aside id="outline-panel" class="outline-panel">
          <div class="outline-header">
            <span data-i18n="outline"></span>
            <button id="btn-outline-close" class="tb-btn small">
              <span class="tb-icon" data-icon="x"></span>
            </button>
          </div>
          <nav id="outline-list" class="outline-list"></nav>
        </aside>
        <section class="editor-pane">
          <div id="find-bar" class="find-bar hidden">
            <input id="find-input" type="text" data-i18n-placeholder="findPlaceholder" />
            <span id="find-count" class="find-count"></span>
            <button id="btn-find-prev" class="tb-btn small" data-i18n-title="find">
              <span class="tb-icon" data-icon="chevron-up"></span>
            </button>
            <button id="btn-find-next" class="tb-btn small" data-i18n-title="find">
              <span class="tb-icon" data-icon="chevron-down"></span>
            </button>
            <button id="btn-replace-one" class="btn small hidden" data-i18n="replace"></button>
            <button id="btn-replace-all" class="btn small hidden" data-i18n="replaceAll"></button>
            <input id="replace-input" type="text" class="hidden" data-i18n-placeholder="replacePlaceholder" />
            <button id="btn-find-close" class="tb-btn small" data-i18n-title="close">
              <span class="tb-icon" data-icon="x"></span>
            </button>
          </div>
          <div id="recent-panel" class="recent-panel hidden">
            <div class="recent-title" data-i18n="recentFiles"></div>
            <nav id="recent-list" class="recent-list"></nav>
          </div>
          <div id="editor" class="editor"></div>
          <textarea id="source" class="source" spellcheck="false"></textarea>
        </section>
      </div>
      <footer class="statusbar">
        <div class="status-left">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-file" class="status-file"></span>
        </div>
        <div class="status-mid" id="status-words"></div>
        <div class="status-right">
          <button id="btn-zoom-out" class="tb-btn small">
            <span class="tb-icon" data-icon="minus"></span>
          </button>
          <span id="status-zoom">100%</span>
          <button id="btn-zoom-in" class="tb-btn small">
            <span class="tb-icon" data-icon="plus"></span>
          </button>
          <button id="btn-zoom-reset" class="tb-btn small" data-i18n-title="zoomReset">
            <span class="tb-icon" data-icon="rotate-ccw"></span>
          </button>
        </div>
      </footer>
    </div>
    <div id="settings-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title" data-i18n="settings"></div>
        <div class="modal-body">
          <label class="field">
            <span data-i18n="language"></span>
            <select id="set-lang">
              <option value="zh">简体中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="theme"></span>
            <select id="set-theme">
              <option value="system" data-i18n="themeSystem"></option>
              <option value="light" data-i18n="themeLight"></option>
              <option value="dark" data-i18n="themeDark"></option>
            </select>
          </label>
          <label class="field row">
            <input type="checkbox" id="set-autosave" />
            <span data-i18n="autosave"></span>
          </label>
          <label class="field">
            <span data-i18n="autosaveInterval"></span>
            <input type="number" id="set-autosave-interval" min="5" max="600" step="5" />
          </label>
          <label class="field row">
            <input type="checkbox" id="set-autosave-toast" />
            <span data-i18n="autosaveToast"></span>
          </label>
          <label class="field row">
            <input type="checkbox" id="set-session-restore" />
            <span data-i18n="sessionRestore"></span>
          </label>
          <label class="field">
            <span data-i18n="imageStrategy"></span>
            <select id="set-image-strategy">
              <option value="relative" data-i18n="imageRelative"></option>
              <option value="original" data-i18n="imageOriginal"></option>
            </select>
          </label>
          <label class="field row">
            <input type="checkbox" id="set-associate" />
            <span data-i18n="mdAssociate"></span>
          </label>
        </div>
        <div class="modal-actions">
          <button id="btn-settings-close" class="btn primary" data-i18n="close"></button>
        </div>
      </div>
    </div>
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title" data-i18n="unsavedTitle"></div>
        <div class="modal-body" data-i18n="unsavedBody"></div>
        <div class="modal-actions">
          <button id="btn-confirm-save" class="btn primary" data-i18n="unsavedSave"></button>
          <button id="btn-confirm-discard" class="btn" data-i18n="unsavedDiscard"></button>
          <button id="btn-confirm-cancel" class="btn" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <div id="conflict-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title" data-i18n="conflictTitle"></div>
        <div class="modal-body" data-i18n="conflictBody"></div>
        <div class="modal-actions">
          <button id="btn-conflict-overwrite" class="btn primary" data-i18n="conflictOverwrite"></button>
          <button id="btn-conflict-reload" class="btn" data-i18n="conflictReload"></button>
          <button id="btn-conflict-cancel" class="btn" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
